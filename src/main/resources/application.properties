spring.application.name=block-not

# --- Price tracker (CoinGecko) ---
# Add more coins by comma-separating CoinGecko IDs, e.g. cardano,bitcoin,ethereum
blocknot.tracker.coin-ids=${CRYPTO_CURRENCIES:cardano}

# Quote currency for prices
blocknot.tracker.vs-currency=${FIAT_CURRENCY:usd}

# Polling interval (milliseconds)
blocknot.tracker.poll-delay-ms=${POLL_INTERVAL_MS:10000}

# API base URL (change if you later use a proxy)
blocknot.tracker.api-base-url=https://api.coingecko.com/api/v3

# CoinGecko API key (Demo / free tier)
blocknot.tracker.api-key=${COINGECKO_DEMO_API_KEY:}

# Request timeout (milliseconds)
blocknot.tracker.request-timeout-ms=3000

# Price thresholds - Telegram notification sent only when price surpasses threshold
# Format: blocknot.tracker.price-thresholds.{coin-id}={threshold-value}
# Defaults to 0 (disabled). Set a positive value to enable alerts.
blocknot.tracker.price-thresholds.cardano=${PRICE_THRESHOLD_CARDANO:0}
blocknot.tracker.price-thresholds.polkadot=${PRICE_THRESHOLD_POLKADOT:0}
blocknot.tracker.price-thresholds.ethereum=${PRICE_THRESHOLD_ETHEREUM:0}
blocknot.tracker.price-thresholds.bitcoin=${PRICE_THRESHOLD_BITCOIN:0}
blocknot.tracker.price-thresholds.kaspa=${PRICE_THRESHOLD_KASPA:0}

# --- Telegram Bot ---
# Get your bot token from @BotFather on Telegram
blocknot.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

# Chat ID to send messages to (can be a user ID or group chat ID)
blocknot.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Request timeout for Telegram API calls (milliseconds)
blocknot.telegram.request-timeout-ms=30000

# Maximum consecutive Telegram send failures before crashing the application
blocknot.telegram.max-consecutive-failures=5

# --- One Piece Manga Tracker ---
blocknot.manga.target-url=https://tcbonepiecechapters.com/mangas/5/one-piece
blocknot.manga.poll-delay-ms=${ONE_PIECE_POLL_INTERVAL_MS:1800000}
blocknot.manga.request-timeout-ms=10000

# --- OpenCode Version Tracker ---
blocknot.opencode.poll-delay-ms=${OPENCODE_POLL_INTERVAL_MS:3600000}
blocknot.opencode.request-timeout-ms=10000
blocknot.opencode.github-token=${GITHUB_TOKEN:}


# --- OpenCode Telegram Bot Commit Tracker ---
blocknot.opencodetgbot.api-url=https://api.github.com/repos/grinev/opencode-telegram-bot/releases/latest
blocknot.opencodetgbot.poll-delay-ms=${OPENCODE_TG_BOT_POLL_INTERVAL_MS:3600000}
blocknot.opencodetgbot.request-timeout-ms=10000
blocknot.opencodetgbot.github-token=${GITHUB_TOKEN:}

# --- ZeroClaw Release Tracker ---
blocknot.zeroclaw.api-url=https://api.github.com/repos/zeroclaw-labs/zeroclaw/releases/latest
blocknot.zeroclaw.poll-delay-ms=${ZEROCLAW_POLL_INTERVAL_MS:3600000}
blocknot.zeroclaw.request-timeout-ms=10000
blocknot.zeroclaw.github-token=${GITHUB_TOKEN:}

